# Configuration du projet Supabase - Sillage Sante
project_id = "sillage-sante"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public", "medical"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.pooler]
enabled = true
pool_mode = "transaction"

[realtime]
enabled = true

[studio]
enabled = true

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.buckets.documents-medicaux]
public = false
file_size_limit = "50MiB"
allowed_mime_types = ["application/pdf", "image/png", "image/jpeg", "application/dicom"]

[storage.buckets.avatars]
public = true
file_size_limit = "2MiB"
allowed_mime_types = ["image/png", "image/jpeg", "image/webp"]

[storage.buckets.ordonnances]
public = false
file_size_limit = "5MiB"
allowed_mime_types = ["application/pdf"]

[auth]
enabled = true
site_url = "env(NEXT_PUBLIC_SITE_URL)"
additional_redirect_urls = ["https://sillage-sante.example/**", "http://localhost:3000/**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
# Pre-inscription : le patient remplit son questionnaire avant de creer un compte
enable_anonymous_sign_ins = true
# Fusion du compte anonyme avec le compte definitif
enable_manual_linking = true

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true
otp_expiry = 600

# SMTP transactionnel Brevo.
# DESACTIVE sur ce deploiement : sans SMTP_USER / SMTP_PASS, `supabase config
# push` pousserait les chaines "env(SMTP_USER)" telles quelles et casserait
# l'envoi d'e-mails. Reactiver en renseignant les deux variables avant le push.
# [auth.email.smtp]
# host = "smtp-relay.brevo.com"
# port = 587
# user = "env(SMTP_USER)"
# pass = "env(SMTP_PASS)"
# admin_email = "no-reply@sillage-sante.example"
# sender_name = "Sillage Sante"

# Gabarits d'e-mails transactionnels surcharges.
# DESACTIVES sur ce deploiement : le plan gratuit Supabase refuse toute
# modification de gabarit tant qu'un SMTP custom n'est pas configure
#   400 "Email template modification is not available for free tier projects
#        using the default email provider."
# Le bloc [auth] etant pousse en un seul appel, ces deux sections faisaient
# echouer TOUT le push auth, hook custom_access_token compris.
# Les gabarits restent dans templates/ : c'est un point de la migration.
# [auth.email.template.magic_link]
# subject = "Votre lien de connexion Sillage Sante"
# content_path = "./templates/magic_link.html"

# [auth.email.template.invite]
# subject = "Vous etes invite sur Sillage Sante"
# content_path = "./templates/invite.html"

[auth.sms]
enable_signup = false
enable_confirmations = true

[auth.mfa]
max_enrolled_factors = 3

# MFA obligatoire cote applicatif pour les praticiens (verifie via aal2 dans les policies RLS)
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

# Fournisseur d'identite des professionnels de sante (Pro Sante Connect).
# enabled = false tant que PSC_CLIENT_ID / PSC_CLIENT_SECRET / PSC_ISSUER_URL
# ne sont pas renseignes : la CLI ne resout pas les env() manquants, elle
# pousserait la chaine "env(PSC_CLIENT_ID)" comme client_id.
# La surface reste declaree : c'est un point du plan de migration (OIDC a
# rebrancher sur le GoTrue ou le Keycloak cible).
[auth.external.keycloak]
enabled = false
client_id = "env(PSC_CLIENT_ID)"
secret = "env(PSC_CLIENT_SECRET)"
url = "env(PSC_ISSUER_URL)"
redirect_uri = "env(NEXT_PUBLIC_SITE_URL)/auth/callback"

# Meme raison : pas de credentials Google sur ce deploiement de demo.
[auth.external.google]
enabled = false
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_SECRET)"
skip_nonce_check = false

# Hook GoTrue : injecte les claims metier dans l'access token
[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/auth_hooks/custom_access_token"

[edge_runtime]
enabled = true
policy = "per_worker"

[functions.rappel-rdv]
verify_jwt = false

[functions.ordonnance-pdf]
verify_jwt = true

[functions.document-scan]
verify_jwt = false

[functions.recherche-semantique]
verify_jwt = true

[functions.traiter-files]
verify_jwt = false

# SSO etablissement (SAML 2.0) : active par API, pas par config.toml.
# cf. supabase sso add --project-ref <ref> --type saml --metadata-url <url>
[auth.external.workos]
enabled = false

[analytics]
enabled = false
