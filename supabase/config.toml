# Configuration du projet Supabase - Sillage Sante
project_id = "sillage-sante"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public", "medical"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.pooler]
enabled = true
pool_mode = "transaction"

[realtime]
enabled = true

[studio]
enabled = true

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.buckets.documents-medicaux]
public = false
file_size_limit = "50MiB"
allowed_mime_types = ["application/pdf", "image/png", "image/jpeg", "application/dicom"]

[storage.buckets.avatars]
public = true
file_size_limit = "2MiB"
allowed_mime_types = ["image/png", "image/jpeg", "image/webp"]

[storage.buckets.ordonnances]
public = false
file_size_limit = "5MiB"
allowed_mime_types = ["application/pdf"]

[auth]
enabled = true
site_url = "env(NEXT_PUBLIC_SITE_URL)"
additional_redirect_urls = ["https://sillage-sante.example/**", "http://localhost:3000/**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
# Pre-inscription : le patient remplit son questionnaire avant de creer un compte
enable_anonymous_sign_ins = true
# Fusion du compte anonyme avec le compte definitif
enable_manual_linking = true

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true
otp_expiry = 600

[auth.email.smtp]
host = "smtp-relay.brevo.com"
port = 587
user = "env(SMTP_USER)"
pass = "env(SMTP_PASS)"
admin_email = "no-reply@sillage-sante.example"
sender_name = "Sillage Sante"

# Gabarits d'e-mails transactionnels surcharges
[auth.email.template.magic_link]
subject = "Votre lien de connexion Sillage Sante"
content_path = "./templates/magic_link.html"

[auth.email.template.invite]
subject = "Vous etes invite sur Sillage Sante"
content_path = "./templates/invite.html"

[auth.sms]
enable_signup = false
enable_confirmations = true

[auth.mfa]
max_enrolled_factors = 3

# MFA obligatoire cote applicatif pour les praticiens (verifie via aal2 dans les policies RLS)
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

# Fournisseur d'identite des professionnels de sante (Pro Sante Connect)
[auth.external.keycloak]
enabled = true
client_id = "env(PSC_CLIENT_ID)"
secret = "env(PSC_CLIENT_SECRET)"
url = "env(PSC_ISSUER_URL)"
redirect_uri = "env(NEXT_PUBLIC_SITE_URL)/auth/callback"

[auth.external.google]
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_SECRET)"
skip_nonce_check = false

# Hook GoTrue : injecte les claims metier dans l'access token
[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/auth_hooks/custom_access_token"

[edge_runtime]
enabled = true
policy = "per_worker"

[functions.rappel-rdv]
verify_jwt = false

[functions.ordonnance-pdf]
verify_jwt = true

[functions.document-scan]
verify_jwt = false

[functions.recherche-semantique]
verify_jwt = true

[functions.traiter-files]
verify_jwt = false

# SSO etablissement (SAML 2.0) : active par API, pas par config.toml.
# cf. supabase sso add --project-ref <ref> --type saml --metadata-url <url>
[auth.external.workos]
enabled = false

[analytics]
enabled = false
